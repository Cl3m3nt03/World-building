name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Git hooks are for local commits only.
  LEFTHOOK: "0"
  # sqlx checks query! macros against the committed .sqlx/ cache, no database.
  SQLX_OFFLINE: "true"

jobs:
  check:
    name: Lint, typecheck and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format (Biome)
        run: pnpm exec biome format .

      - name: Lint (Biome)
        run: pnpm lint:ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (Vitest)
        run: pnpm test

      - name: Format (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint (clippy)
        run: pnpm lint:rust

      - name: Tests (cargo)
        run: pnpm test:rust

      # `cargo test` regenerates src/lib/bindings.ts (export_bindings test):
      # any difference means the committed bindings are out of date.
      - name: Bindings up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- src/lib/bindings.ts; then
            echo "::error file=src/lib/bindings.ts::Bindings are out of date. Run 'pnpm bindings' and commit the result."
            exit 1
          fi
