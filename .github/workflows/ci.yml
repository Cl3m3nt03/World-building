name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Git hooks are for local commits only.
  LEFTHOOK: "0"
  # sqlx checks query! macros against the committed .sqlx/ cache, no database.
  SQLX_OFFLINE: "true"

jobs:
  check:
    name: Lint, typecheck and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format (Biome)
        run: pnpm exec biome format .

      - name: Lint (Biome)
        run: pnpm lint:ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (Vitest)
        run: pnpm test

      - name: Format (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint (clippy)
        run: pnpm lint:rust

      - name: Tests (cargo)
        run: pnpm test:rust

      # `cargo test` regenerates src/lib/bindings.ts (export_bindings test):
      # any difference means the committed bindings are out of date.
      - name: Bindings up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- src/lib/bindings.ts; then
            echo "::error file=src/lib/bindings.ts::Bindings are out of date. Run 'pnpm bindings' and commit the result."
            exit 1
          fi

  e2e:
    name: End-to-end tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Also caches ~/.cargo/bin, so tauri-driver is not rebuilt every run.
          cache-bin: true

      - name: Install tauri-driver
        shell: bash
        run: |
          if ! command -v tauri-driver >/dev/null; then
            cargo install tauri-driver@2.0.6 --locked
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs the msedgedriver matching the runner's WebView2, builds the
      # app in debug mode, then runs e2e/specs with a temporary BUILDERZ_HOME.
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          # Kept for the artifact below (the runner context only exists at step level).
          BUILDERZ_HOME: ${{ runner.temp }}/builderz-e2e
          E2E_KEEP_HOME: "1"
          # Verbose msedgedriver log (see e2e/wdio.conf.ts).
          E2E_DRIVER_LOG: ${{ runner.temp }}/msedgedriver.log

      # On failure: msedgedriver, app and WebView2 logs, to diagnose a
      # "session not created" or a failing scenario without guessing.
      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/msedgedriver.log
            ${{ runner.temp }}/builderz-e2e/logs
            ${{ runner.temp }}/builderz-e2e/webview2/**/*.log
          if-no-files-found: warn
