name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Git hooks are for local commits only.
  LEFTHOOK: "0"
  # sqlx checks query! macros against the committed .sqlx/ cache, no database.
  SQLX_OFFLINE: "true"

jobs:
  check:
    name: Lint, typecheck and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format (Biome)
        run: pnpm exec biome format .

      - name: Lint (Biome)
        run: pnpm lint:ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (Vitest)
        run: pnpm test

      - name: Format (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint (clippy)
        run: pnpm lint:rust

      - name: Tests (cargo)
        run: pnpm test:rust

      # `cargo test` regenerates src/lib/bindings.ts (export_bindings test):
      # any difference means the committed bindings are out of date.
      - name: Bindings up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- src/lib/bindings.ts; then
            echo "::error file=src/lib/bindings.ts::Bindings are out of date. Run 'pnpm bindings' and commit the result."
            exit 1
          fi

  e2e:
    name: End-to-end tests
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # The default %TEMP% on the runner is an 8.3 short path (C:\Users\RUNNER~1\...).
      # msedgedriver puts the WebView2 profile there and then never finds its
      # DevToolsActivePort file; the runner temp dir has a regular long path.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Also caches ~/.cargo/bin, so tauri-driver is not rebuilt every run.
          cache-bin: true

      - name: Install tauri-driver
        shell: bash
        run: |
          if ! command -v tauri-driver >/dev/null; then
            cargo install tauri-driver@2.0.6 --locked
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: WebView2 and Edge versions
        shell: pwsh
        run: |
          foreach ($dir in "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application") {
            if (Test-Path $dir) { Get-ChildItem $dir -Directory | Where-Object Name -match '^\d' | ForEach-Object { "$dir\$($_.Name)" } }
          }

      # Installs the msedgedriver matching the runner's WebView2, builds the
      # app in debug mode, then runs e2e/specs with a temporary BUILDERZ_HOME.
      - name: End-to-end tests
        run: pnpm test:e2e
