[package]
name = "builderz"
version = "1.0.0"
description = "BuilderZ — local worldbuilding desktop app"
authors = ["Clément Le Goffic"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "builderz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde-well-known", "formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["fs", "rt", "sync"] }
sha2 = "0.11.0"
tauri-plugin-dialog = "2"
imagesize = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
fs4 = "1"

[lints.rust]
# MSVC prints an informational "creating library .dll.lib" line when linking the
# cdylib; rustc surfaces it as a warning, which would fail `-D warnings` builds.
linker_messages = "allow"
unsafe_code = "forbid"

[lints.clippy]
# No `unwrap()` / `expect()` outside tests: errors go through `AppError` (CLAUDE.md).
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
