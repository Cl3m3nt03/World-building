[package]
name = "builderz"
version = "0.1.0"
description = "BuilderZ — local worldbuilding desktop app"
authors = ["Clément Le Goffic"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "builderz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
# MSVC prints an informational "creating library .dll.lib" line when linking the
# cdylib; rustc surfaces it as a warning, which would fail `-D warnings` builds.
linker_messages = "allow"
unsafe_code = "forbid"

[lints.clippy]
# No `unwrap()` / `expect()` outside tests: errors go through `AppError` (CLAUDE.md).
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
